<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جامع الشريف - تحديث البيانات والدعم الفني</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #2e7d32; /* الأخضر المتوافق مع الهوية الجديدة */
      --secondary: #1b5e20;
      --light-bg: #f4f7f5;
      --white: #ffffff;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--light-bg);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .support-container {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      margin: 20px;
      border-top: 6px solid var(--primary);
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header img {
      height: 60px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .form-header h4 {
      font-weight: 700;
      color: #222;
    }

    .form-header p {
      color: #666;
      font-size: 0.95rem;
    }

    /* تصميم الراديو (نوع الطلب) بشكل أزرار عصرية */
    .request-type-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .request-type-btn {
      position: relative;
    }

    .request-type-btn input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .request-type-btn label {
      display: block;
      text-align: center;
      background: #f8faf9;
      border: 2px solid #e1e8e4;
      padding: 12px 5px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      color: #444;
      transition: all 0.25s ease;
    }

    .request-type-btn input[type="radio"]:checked + label {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
    }

    /* تنسيق الحقول */
    .form-label {
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .input-group-text {
      background-color: #f8faf9;
      border-color: #e1e8e4;
      color: var(--primary);
    }

    .form-control, .form-select {
      border: 2px solid #e1e8e4;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.2rem rgba(46, 125, 50, 0.1);
    }

    .btn-submit {
      background-color: var(--primary);
      color: var(--white);
      font-weight: 700;
      padding: 12px;
      border-radius: 12px;
      border: none;
      width: 100%;
      margin-top: 15px;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--secondary);
      color: var(--white);
      transform: translateY(-2px);
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="support-container">
    <div class="form-header">
      <img src="logo.jpeg" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2920/2920323.png';">
      <h4>منصة جامع الشريف الإلكترونية</h4>
      <p>يرجى اختيار نوع الطلب وتعبئة البيانات بشكل صحيح لتصل إلى الإدارة فوراً</p>
    </div>

    <form action="https://formspree.io/f/alahliclub050@gmail.com" method="POST">
      
      <label class="form-label d-block text-center mb-2">نوع الطلب الفني</label>
      <div class="request-type-group">
        <div class="request-type-btn">
          <input type="radio" id="type1" name="نوع_الطلب" value="تعديل بيانات" checked>
          <label for="type1"><i class="fa-solid fa-user-gear d-block mb-1"></i> تعديل بيانات</label>
        </div>
        <div class="request-type-btn">
          <input type="radio" id="type2" name="نوع_الطلب" value="نسيت كلمة السر">
          <label for="type2"><i class="fa-solid fa-key d-block mb-1"></i> نسيان كلمة السر</label>
        </div>
        <div class="request-type-btn">
          <input type="radio" id="type3" name="نوع_الطلب" value="طلب دعم">
          <label for="type3"><i class="fa-solid fa-headset d-block mb-1"></i> طلب دعم فني</label>
        </div>
      </div>

      <div class="mb-3">
        <label for="fullName" class="form-label">الاسم الرباعي المعتمد</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" class="form-control" id="fullName" name="الاسم_الرباعي" placeholder="أدخل اسمك الكامل كما هو مسجل" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">رقم الجوال (الواتساب)</label>
        <div class="input-group" dir="ltr">
          <input type="tel" class="form-control text-end" id="phone" name="رقم_الجوال" placeholder="05xxxxxxxx" required>
          <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="identity" class="form-label">رقم الهوية الوطنية / الإقامة</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
          <input type="number" class="form-control" id="identity" name="رقم_الهوية" placeholder="أدخل 10 أرقام" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">تفاصيل الطلب أو الرسالة</label>
        <textarea class="form-control" id="message" name="نص_الرسالة" rows="4" placeholder="اكتب هنا التعديل المطلوب أو المشكلة التي تواجهك بالتفصيل..." required></textarea>
      </div>

      <button type="submit" class="btn btn-submit">
        <i class="fa-solid fa-paper-plane me-1"></i> إرسال الطلب فوراً
      </button>

    </form>

    <div class="back-link">
      <a href="index.html"><i class="fa-solid fa-arrow-right me-1"></i> العودة للرئيسية</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
